# PostgreSQL Connection Pooling Configuration
# This configuration uses pgBouncer for connection pooling

default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # pgBouncer connection details
  host: 127.0.0.1
  port: 6432
  username: postgres
  password: <%= ENV["KNOWVERSE_DATABASE_PASSWORD"] %>
  # Important for pgBouncer
  prepared_statements: false
  advisory_locks: false

development:
  <<: *default
  database: knowverse_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: knowverse_development_test

production:
  primary: &primary_production
    <<: *default
    database: knowverse_development_production
    username: <%= ENV["KNOWVERSE_DATABASE_USERNAME"] %>
    password: <%= ENV["KNOWVERSE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: knowverse_development_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: knowverse_development_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: knowverse_development_production_cable
    migrations_paths: db/cable_migrate
