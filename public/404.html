<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Page Not Found - KnowVerse</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#6366f1">

    <style>
      /* Berkeley Mono fallback stack */
      @font-face {
        font-family: 'Berkeley Mono';
        src: local('Berkeley Mono'), local('BerkeleyMono-Regular');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 16px;
        height: 100%;
      }

      body {
        background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
        color: #1e293b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Berkeley Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
        padding: 2rem;
        text-rendering: optimizeLegibility;
      }

      .container {
        text-align: center;
        max-width: 480px;
        width: 100%;
      }

      .error-code {
        font-size: clamp(5rem, 15vw, 8rem);
        font-weight: 700;
        color: #6366f1;
        line-height: 1;
        margin-bottom: 1rem;
        letter-spacing: -0.02em;
        text-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
      }

      .brand {
        font-size: 1.5rem;
        font-weight: 700;
        color: #6366f1;
        margin-bottom: 2rem;
        letter-spacing: -0.01em;
      }

      h1 {
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 1rem;
      }

      .message {
        font-size: 1rem;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .home-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: #6366f1;
        color: white;
        text-decoration: none;
        padding: 0.875rem 1.75rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
      }

      .home-link:hover {
        background: #4f46e5;
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
      }

      .home-link:active {
        transform: translateY(0);
      }

      .home-link svg {
        width: 1.25rem;
        height: 1.25rem;
      }

      .decoration {
        margin-top: 3rem;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6366f1;
        opacity: 0.3;
      }

      .dot:nth-child(2) {
        opacity: 0.5;
      }

      .dot:nth-child(3) {
        opacity: 0.7;
      }

      .dot:nth-child(4) {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="error-code">404</div>
      <div class="brand">KnowVerse</div>

      <h1>Page Not Found</h1>

      <p class="message">
        The page you're looking for doesn't exist or has been moved.
        Let's get you back on track.
      </p>

      <a href="/" class="home-link">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        Back to Home
      </a>

      <div class="decoration">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </body>
</html>
