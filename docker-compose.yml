# Knowverse Enterprise Docker Development Environment
# Multi-service stack for Rails 8 + Python AI/RAG + PostgreSQL + Redis
version: '3.8'

services:
  # PostgreSQL 14+ with pgvector extension
  postgres:
    image: pgvector/pgvector:pg14
    container_name: knowverse-postgres
    environment:
      POSTGRES_DB: knowverse_development
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowverse

  # Redis 7+ for caching and session management
  # NOTE: Uses "docker" profile - native Redis on host is preferred
  # Start with: docker-compose --profile docker up redis (only if native Redis not running)
  redis:
    image: redis:7-alpine
    container_name: knowverse-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - docker
    networks:
      - knowverse

  # Python Haystack AI/RAG Service (FastAPI)
  haystack:
    build:
      context: ./services/haystack
      dockerfile: Dockerfile
    container_name: knowverse-haystack
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/knowverse_development
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-anthropic}
      - DEFAULT_OPENAI_MODEL=${DEFAULT_OPENAI_MODEL:-gpt-4o}
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./services/haystack:/app
      - haystack_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - knowverse

  # Rails 8 Application (Main Service)
  rails:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: knowverse-rails
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/knowverse_development
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - QDRANT_URL=http://qdrant:6333
      - HAYSTACK_SERVICE_URL=http://haystack:8000
      - RUST_EMBEDDING_URL=http://rust-embedding:8001
      - RUST_DOCPROC_URL=http://rust-docproc:8002
      - USE_RUST_SERVICES=true
      - SOLID_QUEUE_IN_PUMA=true
      - WEB_CONCURRENCY=1
      - RAILS_MAX_THREADS=3
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
      - rails_tmp:/rails/tmp
      - rails_log:/rails/log
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      haystack:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - knowverse

  # Qdrant Vector Database (Enterprise-grade vector search with native Raft consensus)
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: knowverse-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./config/qdrant:/qdrant/config:ro
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q ready <&3'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowverse

  # Background Job Processor (SolidQueue)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: knowverse-worker
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/knowverse_development
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - HAYSTACK_SERVICE_URL=http://haystack:8000
      - RUST_EMBEDDING_URL=http://rust-embedding:8001
      - RUST_DOCPROC_URL=http://rust-docproc:8002
      - USE_RUST_SERVICES=true
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      postgres:
        condition: service_healthy
      rails:
        condition: service_started
    command: bundle exec rails solid_queue:start
    networks:
      - knowverse

  # Rust Embedding Service (ONNX Runtime - 10-50x faster than Python)
  rust-embedding:
    build:
      context: ./services/embedding-rust
      dockerfile: Dockerfile
    container_name: knowverse-rust-embedding
    environment:
      - EMBEDDING_HOST=0.0.0.0
      - EMBEDDING_PORT=8001
      - MODEL_PATH=/app/models
      - DEFAULT_MODEL=all-MiniLM-L6-v2
      - CACHE_SIZE_MB=512
      - MAX_BATCH_SIZE=64
      - RUST_LOG=info
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - embedding_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - rust
    networks:
      - knowverse

  # Rust Document Processor (WASM-sandboxed parsing - 5-10x faster)
  rust-docproc:
    build:
      context: ./services/document-processor
      dockerfile: Dockerfile
    container_name: knowverse-rust-docproc
    environment:
      - DOCPROC_HOST=0.0.0.0
      - DOCPROC_PORT=8002
      - MAX_FILE_SIZE_MB=100
      - TEMP_DIR=/tmp/docproc
      - SANDBOX_ENABLED=true
      - TIMEOUT_SECONDS=60
      - RUST_LOG=info
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - rust
    networks:
      - knowverse

  # CSS Watcher (Tailwind)
  css:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: knowverse-css
    environment:
      - RAILS_ENV=development
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules
    command: bundle exec rails tailwindcss:watch
    profiles:
      - tools
    networks:
      - knowverse

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  embedding_models:
    driver: local
  qdrant_data:
    driver: local
  bundle_cache:
    driver: local
  node_modules:
    driver: local
  rails_tmp:
    driver: local
  rails_log:
    driver: local
  haystack_models:
    driver: local

networks:
  knowverse:
    driver: bridge
