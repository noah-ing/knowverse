name: Knowverse CI

on:
  pull_request:
  push:
    branches: [main, knowverse-integration]

env:
  RAILS_ENV: test

jobs:
  # Security scan for Ruby
  scan_ruby:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install security tools
        run: gem install bundler-audit brakeman

      - name: Run bundle-audit (dependency vulnerabilities)
        run: bundle-audit check --update
        continue-on-error: true  # Report but don't block (yet)

      - name: Run Brakeman (static analysis)
        run: |
          brakeman -q --no-pager -f json -o brakeman-output.json || true
          brakeman -q --no-pager
        continue-on-error: true  # Report but don't block (yet)

      - name: Upload Brakeman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brakeman-report
          path: brakeman-output.json
          retention-days: 30

  # Ruby linting
  lint:
    name: Ruby Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run RuboCop
        run: bin/rubocop -f github

  # Rails RSpec Tests
  rails-tests:
    name: Rails Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowverse_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libpq-dev libyaml-dev pkg-config

      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Setup database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/knowverse_test
          REDIS_URL: redis://localhost:6379/0
          RESEND_API_KEY: test_key_for_ci
          HAYSTACK_SERVICE_URL: http://localhost:8000
        run: |
          bin/rails db:create db:schema:load

      - name: Run RSpec tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/knowverse_test
          REDIS_URL: redis://localhost:6379/0
          RESEND_API_KEY: test_key_for_ci
          HAYSTACK_SERVICE_URL: http://localhost:8000
        run: |
          bundle exec rspec --format documentation

  # Python Haystack Tests
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/haystack/requirements.txt

      - name: Install dependencies
        working-directory: services/haystack
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run pytest
        working-directory: services/haystack
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short

  # Rust Embedding Service Tests
  rust-embedding:
    name: Rust Embedding Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # New service, requires ONNX runtime
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/embedding-rust

      - name: Check compilation
        working-directory: services/embedding-rust
        run: cargo check --verbose

      - name: Check formatting
        working-directory: services/embedding-rust
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: services/embedding-rust
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Run tests (requires ONNX runtime)
        working-directory: services/embedding-rust
        run: cargo test --verbose
        continue-on-error: true

  # Rust Document Processor Tests
  rust-docproc:
    name: Rust DocProc Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # New service, requires Wasmtime setup
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/document-processor

      - name: Check compilation
        working-directory: services/document-processor
        run: cargo check --verbose

      - name: Check formatting
        working-directory: services/document-processor
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: services/document-processor
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Run tests
        working-directory: services/document-processor
        run: cargo test --verbose
        continue-on-error: true

  # Docker build verification
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [rails-tests, python-tests, rust-embedding, rust-docproc]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build Haystack image
        uses: docker/build-push-action@v5
        with:
          context: ./services/haystack
          push: false
          tags: knowverse-haystack:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Rust Embedding image
        uses: docker/build-push-action@v5
        with:
          context: ./services/embedding-rust
          push: false
          tags: knowverse-embedding:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Rust DocProc image
        uses: docker/build-push-action@v5
        with:
          context: ./services/document-processor
          push: false
          tags: knowverse-docproc:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
